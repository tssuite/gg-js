name: ggwsm
description: >
  Bridge exposing a Dart package as a JavaScript and WebAssembly
  module with hand-typed TypeScript declarations.
version: 0.1.1
repository: https://github.com/tssuite/ggwsm.git
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  web: ^1.1.1
  gg: ^17.1.1
  gg_log: ^1.1.0
dev_dependencies:
  gg_console_colors: ^2.4.0
  lints: ^6.1.0
  test: ^1.31.2
