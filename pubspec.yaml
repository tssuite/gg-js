name: gg_js
description: >
  Bridge exposing a Dart package as a JavaScript and WebAssembly
  module with hand-typed TypeScript declarations.
version: 1.0.2
repository: https://github.com/tssuite/gg_js.git
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  web: ^1.1.1
  gg: ^16.0.0
  gg_log: ^1.0.6
dev_dependencies:
  gg_console_colors: ^2.3.0
  lints: ^6.1.0
  test: ^1.31.2