name: ggwsm
description: >
  The [`gg`](https://github.com/ggsuite/gg) command line — the tool that
  drives commits, reviews and releases across all repositories of a ticket —
  compiled to WebAssembly and published on npm.
version: 0.0.0
repository: https://github.com/tssuite/ggwsm.git
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  web: ^1.1.1
  gg: ^17.1.1
  gg_log: ^1.1.0
dev_dependencies:
  gg_console_colors: ^2.4.0
  lints: ^6.1.0
  test: ^1.31.2
